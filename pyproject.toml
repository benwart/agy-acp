[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agy-acp"
version = "1.0.0"
description = "Google Antigravity SDK wrapper exposing an Agent Client Protocol (ACP) server for KiroCrew."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "cyclopts>=3.0.0",
    "google-antigravity>=0.1.22",
    "zensical",
]

[project.scripts]
agy-acp = "agy_acp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "ty>=0.0.89",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "not_implemented: marks tests for requirements not yet implemented (skipped during pre-commit)",
]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
