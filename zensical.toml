[project]
site_name = "agy-acp Documentation"
site_description = "Google Antigravity SDK wrapper exposing an Agent Client Protocol (ACP) server for KiroCrew."
site_url = "https://github.com/benwart/agy-acp"
site_author = "Ben Wart"
copyright = "Copyright &copy; 2026 Ben Wart"
docs_dir = "docs"
site_dir = "site"
dev_addr = "127.0.0.1:8000"

nav = [
  { "Overview" = "index.md" },
  { "Requirements" = [
    { "Requirements Overview" = "requirements/overview.md" },
    { "ACP Harness External Interface" = "requirements/acp-interface.md" },
    { "CLI Authentication & Hot-Reload" = "requirements/authentication.md" },
    { "5h / 7d Quotas & Token Usage" = "requirements/quota-and-usage.md" },
    { "CLI Hierarchy & Docs Site" = "requirements/cli-and-docs.md" },
    { "Verification Traceability Matrix" = "requirements/verification-matrix.md" },
  ] },
  { "Design" = [
    { "Architecture & Component Design" = "design/architecture.md" },
    { "ACP Protocol & SDK Bridge" = "design/acp-sdk-bridge.md" },
    { "Credential Hot-Reload & Quotas" = "design/auth-and-quotas.md" },
  ] },
  { "Guides" = [
    { "Getting Started" = "guides/getting-started.md" },
    { "KiroCrew Integration" = "guides/kirocrew-integration.md" },
  ] },
  { "Runbooks" = [
    { "Auth & Session Troubleshooting" = "runbooks/auth-and-sessions.md" },
    { "Quota & Rate Limit Operations" = "runbooks/quota-operations.md" },
  ] },
]

extra_css = ["assets/stylesheets/extra.css"]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
